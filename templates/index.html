<!doctype html>
<!-- IITD Mailer, made by Ayush Vishwakarma. -->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IITD Mailer · Ayush Vishwakarma</title>
<meta name="author" content="Ayush Vishwakarma">
<script>try{var t=localStorage.getItem("iitdmailer:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preload" href="/static/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Main">
    <div class="brand">
      <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 8v16h22V8l-11 9z"/></svg></span>
      <div><b>IITD Mailer</b><span id="side-scope">Not connected</span></div>
      <button class="close" id="menu-close" aria-label="Close menu"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
    </div>
    <label class="btn ghost new-list"><input type="file" id="side-upload" accept=".csv,text/csv,.txt" hidden>
      <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>New list from CSV</label>
    <nav class="nav" aria-label="Screens">
      <a href="#/log" data-route="log"><svg viewBox="0 0 16 16"><path d="M3 2.5h7l3 3v8H3z"/><path d="M5.5 8h5M5.5 10.5h5"/></svg><span class="t">Sent log</span></a>
      <a href="#/files" data-route="files"><svg viewBox="0 0 16 16"><path d="M10.5 4.5l-5 5a1.8 1.8 0 002.5 2.5l5.5-5.5a3.2 3.2 0 00-4.5-4.5L3.5 7.5"/></svg><span class="t">Attachments</span></a>
      <a href="#/account" data-route="account"><svg viewBox="0 0 16 16"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.8-2.4 2.7-3.5 5-3.5s4.2 1.1 5 3.5"/></svg><span class="t">Account</span></a>
    </nav>
    <div class="grp" id="lists-label">Lists</div>
    <nav class="lists" id="side-lists" aria-label="Lists"></nav>
    <div class="side-foot">
      <div class="theme" role="group" aria-label="Theme"><button data-theme-set="dark">Dark</button><button data-theme-set="light">Light</button></div>
      <div class="credit">Made by <b>Ayush Vishwakarma</b></div>
    </div>
  </aside>

  <header class="topbar">
    <button class="menu-btn" id="menu-open" aria-label="Open menu"><svg viewBox="0 0 20 20"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
    <div class="crumbs" id="crumbs"></div>
    <a class="conn" id="conn" href="#/account"><i></i><span id="conn-text">Not connected</span></a>
  </header>

  <main class="canvas" id="view" tabindex="-1"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js"></script>
</body>
</html>
